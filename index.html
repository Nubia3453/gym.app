<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1e293b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Daily Gym Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Top App Bar with Daily Progress -->
  <header class="mobile-header">
    <div class="header-info">
      <h1 id="active-day-heading">Gym Routine</h1>
      <span id="active-focus-sub" class="sub-heading">Select a day</span>
    </div>
    <div class="header-actions">
      <span id="progress-indicator" class="progress-pill">0 / 0</span>
      <button id="reset-btn" class="reset-btn" aria-label="Reset routine checkboxes">Reset</button>
    </div>
  </header>

  <!-- Sticky Day Tab Bar -->
  <nav class="tabs-nav" aria-label="Day selection">
    <div class="tabs-scroll">
      <button class="tab-btn" data-day="1">Mon</button>
      <button class="tab-btn" data-day="2">Tue</button>
      <button class="tab-btn" data-day="3">Wed</button>
      <button class="tab-btn" data-day="4">Thu</button>
      <button class="tab-btn" data-day="5">Fri</button>
    </div>
  </nav>

  <!-- Dynamic Content Container -->
  <main class="content-container">
    <div id="workout-container" aria-live="polite"></div>
  </main>

  <!-- Fullscreen Image Preview Modal -->
  <div id="image-modal" class="modal hidden" role="dialog" aria-hidden="true">
    <button id="modal-close" class="modal-close-btn" aria-label="Close preview">&times;</button>
    <img id="modal-img" src="" alt="Exercise form view" />
    <p id="modal-caption" class="modal-caption"></p>
  </div>

  <!-- 1. Load Day Data Modules First -->
  <script src="data/monday.js"></script>
  <script src="data/tuesday.js"></script>
  <script src="data/wednesday.js"></script>
  <script src="data/thursday.js"></script>
  <script src="data/friday.js"></script>

  <!-- 2. Load Core Application Logic -->
  <script src="app.js"></script>
</body>
</html>
